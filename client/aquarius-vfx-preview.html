<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>물병자리 VFX 미리보기</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101722;color:#e8f3ff}
    body{margin:0 auto;padding:28px;max-width:1120px}h1{font-size:26px;margin:0 0 10px}p{color:#b7c9df;line-height:1.65}
    .controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 0}button,select{font:inherit;padding:8px 14px;border:1px solid #55708a;border-radius:7px;background:#23354a;color:inherit}input{accent-color:#72cfff}
    .grid{display:grid;grid-template-columns:repeat(4,256px);gap:16px;overflow-x:auto}figure{margin:0;width:256px}figcaption{padding:10px 0;color:#d2e6fc}canvas,.apng{width:256px;height:256px;display:block;background:var(--stage,#1b212a);border-radius:6px}
    h2{font-size:19px;margin-top:30px}.label{font-variant-numeric:tabular-nums}a{color:#82d5ff}#scrub{width:290px}small{color:#acbfd4}
  </style>
</head>
<body>
  <h1>물병자리 · 맑은 물의 흐름</h1>
  <p>물방울 공격과 세 단계의 샘물. 모든 그림은 실제 256×256 크기로 표시됩니다.<br>스킬은 0.5초 발동, 1초 물줄기 순환 4회, 0.5초 소멸로 이어집니다.</p>
  <div class="controls">
    <button id="play" type="button">일시정지</button>
    <label>바탕 <select id="background"><option value="#1b212a">어두움</option><option value="#ebece4">밝음</option><option value="#6a4e3c">흙빛</option></select></label>
    <label><input type="checkbox" id="guides"> 바닥 중심 표시</label>
    <label><input type="checkbox" id="loopOnly"> 쏟는 구간만 반복</label>
    <label>시간 <input type="range" id="scrub" min="0" max="4999" step="1" value="0"></label>
    <span class="label" id="status">준비 중</span>
  </div>
  <h2>프레임 시트 재생</h2>
  <div class="grid" id="sheets"></div>
  <h2>5초 APNG 실제 재생</h2>
  <p>아래 네 장은 브라우저가 직접 재생하는 투명 APNG입니다. 위 일시정지·시간 조절과 별도로 계속 반복됩니다.</p>
  <div class="grid" id="apngs"></div>
  <p><a href="assets/skills/aquarius/manifest.json">자산·타이밍 정보</a> · <a href="assets/skills/aquarius/production-prompts.json">제작 프롬프트</a> · <a href="assets/skills/aquarius/validation.json">프레임 검사 결과</a></p>
  <script src="aquarius-vfx-preview.js"></script>
</body>
</html>
