# 실제 외부 배포는 아직 수행하지 않았습니다. Render Free 테스트용 단일 서버입니다.
# 요청 027: 이 파일에는 영구 디스크/외부 저장소가 없습니다. 학년 데이터 운영용으로 배포하기 전에 반드시 연결·검증하세요.
services:
  - type: web
    name: cyber-classroom
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: TEACHER_KEY
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
